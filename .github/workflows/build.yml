name: Build BadgePro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir -p project
          unzip -o -q "$ZIP" -d project
          # If the zip had a top folder, move into it
          if [ ! -f project/settings.gradle.kts ]; then
            INNER=$(dirname "$(find project -name settings.gradle.kts | head -1)")
            echo "Project found in $INNER"
            cp -r "$INNER"/. project/
          fi
          ls -la project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BadgePro-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
