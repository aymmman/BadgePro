name: Build BadgePro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          mkdir -p project
          unzip -o -q "$ZIP" -d project
          if [ ! -f project/settings.gradle.kts ]; then
            INNER=$(dirname "$(find project -name settings.gradle.kts | head -1)")
            cp -r "$INNER"/. project/
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            echo ""
            echo "================ ERRORS ================"
            grep -E "^e: |error:|What went wrong|Unresolved|Could not" -A4 build.log | head -60
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BadgePro-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
